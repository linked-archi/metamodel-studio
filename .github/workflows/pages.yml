# Publishes the studio to GitHub Pages: https://linked-archi.github.io/metamodel-studio/
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until then the "Configure Pages" step fails with "Get Pages site failed".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancel it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Only what the browser loads: no tests, fixtures or build scripts.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html styles.css js vendor templates _site/
          cp LICENSE NOTICE _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
