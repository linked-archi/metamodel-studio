# The demo on GitHub Pages: the studio, which opens with the Cloud Platform example, and under packages/ the npm
# package and the page's zip with a page saying how to install them (design.md, SD-19). Run by each release, at its
# version, and by hand from the Actions tab, as a development build of the branch chosen.
#
# Needs, once: Settings → Pages → Source: GitHub Actions; and, since a release deploys it from its tag,
# Settings → Environments → github-pages → Deployment branches and tags → a tag rule v*.
name: Demo site

on:
  workflow_call:
    inputs:
      version:
        description: The release's version; none for a development build
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - id: pages
        uses: actions/configure-pages@v6

      # The same command as the release's, so a release's two files here equal those attached to it.
      - name: The site and the packages
        env:
          VERSION: ${{ inputs.version }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build.js ${VERSION:+--version "$VERSION"} --base-url "$BASE_URL/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
