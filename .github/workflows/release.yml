# A release, from a tag: git tag v0.1.0 && git push origin v0.1.0
#
# Builds both packages at the tag's version and attaches them to a GitHub release: the npm package (the la-studio
# command, the engine for Node, and the page) and the page as a zip. Then the demo site, with the same two files
# (design.md, SD-19).
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: The version, from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          pip install --quiet -r requirements-dev.txt
          npm test
          python -m unittest discover -s tests -v

      - name: Both packages, at the tag's version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build.js --version "$VERSION"

      # The ./ makes it a file: npm reads dist/<name>.tgz as the GitHub repository dist/<name>.tgz.
      - name: The npm package installs, and is the tag's version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/la" "./dist/linked-archi-metamodel-studio-$VERSION.tgz"
          "$RUNNER_TEMP/la/bin/la-studio" --version | grep -Fx "la-studio $VERSION"

      - name: The GitHub release, with both packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/linked-archi-metamodel-studio-$VERSION.tgz" "dist/metamodel-studio-$VERSION.zip" \
            --title "Metamodel Studio $VERSION" --generate-notes --verify-tag

  # Called rather than triggered by the release: a release made with the workflow's token starts no other workflow.
  demo:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/demo.yml
    with:
      version: ${{ needs.release.outputs.version }}
